name: docker-arm64
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: 放宽锁文件严格校验(上游 uv.lock 与 pyproject 不同步,arm64 平台标记缺失)
        run: sed -i 's/uv sync --locked --no-dev/uv sync --no-dev/' Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/xiaoletian64/peach:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
